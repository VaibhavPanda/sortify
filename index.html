<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Sorting Visualizer</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>Sortify</h1>
            <nav>
                <div class="controls-grid">
                    <div class="control-section">
                        <button type="button" class="btn btn-secondary newArray">
                            <span>🔄</span> New Array
                        </button>
                    </div>
                    
                    <div class="control-section slider-group">
                        <div class="slider-container">
                            <label class="slider-label" for="arr_sz">Array Size</label>
                            <input id="arr_sz" type="range" class="slider" min="10" max="100" step="1" value="50">
                        </div>
                        <div class="slider-container">
                            <label class="slider-label" for="speed_input">Speed</label>
                            <input id="speed_input" type="range" class="slider" min="1" max="100" step="1" value="50">
                        </div>
                    </div>
                    
                    <div class="control-section">
                        <div class="algorithm-buttons">
                            <button type="button" class="btn btn-primary bubbleSort">Bubble Sort</button>
                            <button type="button" class="btn btn-primary selectionSort">Selection Sort</button>
                            <button type="button" class="btn btn-primary insertionSort">Insertion Sort</button>
                            <button type="button" class="btn btn-primary quickSort">Quick Sort</button>
                            <button type="button" class="btn btn-primary mergeSort">Merge Sort</button>
                        </div>
                    </div>
                </div>
            </nav>
        </div>
    </header>

    <main class="container">
        <div class="visualizer-container">
            <div id="bars" class="flex-container"></div>
        </div>
    </main>

    <!-- Your existing JavaScript files -->
    <script src="js_files/sorting.js"></script>
    <script src="js_files/bubble.js"></script>
    <script src="js_files/insertion.js"></script>
    <script src="js_files/merge.js"></script>
    <script src="js_files/quick.js"></script>
    <script src="js_files/selection.js"></script>
</body>
</html>
